
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Z3ZUSO</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#menu{position:absolute;inset:0;z-index:10;background:radial-gradient(circle,#294653,#071016);display:flex;align-items:center;justify-content:center;flex-direction:column}
#menu h1{font-size:clamp(55px,13vw,100px);margin:0;letter-spacing:8px;text-shadow:0 0 25px #48e6ff}
#menu p{color:#b9cbd3;margin:12px 0 30px}
button{border:0;border-radius:12px;padding:14px 30px;background:#39d5e8;color:#06131a;font-size:20px;font-weight:bold}
#hud{position:absolute;top:10px;left:10px;z-index:5;background:#07131acc;padding:10px;border-radius:12px;font-size:13px;line-height:1.7;pointer-events:none}
#hamburger{position:absolute;top:10px;right:10px;z-index:20;background:#172c38;color:white;padding:8px 14px;font-size:24px}
#codePanel{display:none;position:absolute;z-index:30;top:62px;right:10px;background:#152a36;border:1px solid #4a8294;border-radius:14px;padding:14px;width:min(280px,90vw)}
#codePanel input{width:100%;padding:12px;border-radius:8px;border:1px solid #6c9baa;background:#07131a;color:white;font-size:18px;user-select:text;-webkit-user-select:text;touch-action:auto}
#codePanel button{margin-top:10px;width:100%;font-size:16px}
#message{font-size:13px;min-height:18px;color:#9ff5c9;margin-top:8px}
#upgradePanel{display:none;position:absolute;inset:0;z-index:40;background:#050b0de8;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
.upgradeChoice{display:block;width:min(340px,90vw);margin:8px;background:#183847;color:white;border:1px solid #55d5e8;font-size:16px}
#joystick{position:absolute;z-index:4;width:110px;height:110px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff12;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#stick{position:absolute;width:42px;height:42px;left:34px;top:34px;border-radius:50%;background:#6eeaffaa}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
<h1>Z3ZUSO</h1>
<p>made from John</p>
<button id="playButton">PLAY</button>
</div>

<div id="hud">
❤️ Leben: <span id="health">100</span><br>
⭐ Level: <span id="level">1</span><br>
✨ XP: <span id="xp">0</span>/<span id="xpNeeded">10</span><br>
🌊 Welle: <span id="wave">1</span><br>
⚔️ Schaden: <span id="damage">5</span><br>
🏃 Tempo: <span id="speed">230</span><br>
🔫 NEW-Waffe: <span id="weaponStatus">Aus</span>
</div>

<button id="hamburger">☰</button>
<div id="codePanel">
<strong>Geheimcode eingeben</strong>
<input id="codeInput" type="text" placeholder="Code..." autocomplete="off">
<button id="redeemButton">Einlösen</button>
<div id="message"></div>
</div>

<div id="upgradePanel">
<h2>LEVEL UP!</h2>
<p>Wähle ein Upgrade:</p>
<div id="upgradeChoices"></div>
</div>

<div id="joystick"><div id="stick"></div></div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W=0,H=0;
function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
addEventListener("resize",resize);resize();

let running=false,paused=false,lastTime=0;
let player={
 x:0,y:0,r:16,health:100,maxHealth:100,
 speed:230,damage:5,level:1,xp:0,xpNeeded:10,
 wave:1,swordAngle:0,swordRange:55,swordWidth:19,
 immortal:false,newWeapon:false,newWeaponAngle:0
};

let monsters=[],orbs=[],trees=[];
let spawnTimer=0,elapsed=0,pendingUpgrades=0;
let usedCodes={speed:false,level:false,op:false};
let keys={};
let joystick={active:false,id:null,x:0,y:0,dx:0,dy:0};

for(let i=0;i<180;i++){
 trees.push({x:Math.random()*6000-3000,y:Math.random()*6000-3000,r:12+Math.random()*18});
}

function enemySpeedMultiplier(){
 return Math.min(1+(player.wave-1)*.25,12);
}

function spawnMonster(){
 const angle=Math.random()*Math.PI*2;
 const distance=480+Math.random()*180;
 const roll=Math.random();
 let hp=10,speed=65,r=14,damage=5,xp=3,color="#62e68a",type="slime";
 if(roll>.75){
  type="goblin";hp=22;speed=90;r=16;damage=8;xp=6;color="#a4d64c";
 }
 if(roll>.93){
  type="brute";hp=65;speed=48;r=24;damage=14;xp=12;color="#dc765c";
 }
 const scale=1+Math.min(player.wave-1,1000)*.01;
 monsters.push({
  x:player.x+Math.cos(angle)*distance,
  y:player.y+Math.sin(angle)*distance,
  hp:hp*scale,maxHp:hp*scale,
  speed:speed*enemySpeedMultiplier(),
  r,damage,xp,type,color,
  hitCooldown:0,swordCooldown:0,bodyCooldown:0
 });
}

function addXP(amount){
 player.xp+=amount;
 while(player.xp>=player.xpNeeded){
  player.xp-=player.xpNeeded;
  player.level++;
  player.xpNeeded=Math.floor(player.xpNeeded*1.25+5);
  player.wave++;
  pendingUpgrades+=3;
 }
 if(pendingUpgrades>0&&!paused)showUpgrade();
}

const upgrades=[
 {name:"Mehr Leben",desc:"+25 maximales Leben",apply(){player.maxHealth+=25;player.health=Math.min(player.health+25,player.maxHealth)}},
 {name:"Mehr Schaden",desc:"+3 Schwertschaden",apply(){player.damage+=3}},
 {name:"Schneller",desc:"+15% Bewegungsgeschwindigkeit",apply(){player.speed*=1.15}},
 {name:"Größeres Schwert",desc:"+10 Schwertreichweite",apply(){player.swordRange+=10}},
 {name:"Heilung",desc:"+30 Leben",apply(){player.health=Math.min(player.maxHealth,player.health+30)}}
];

function showUpgrade(){
 if(pendingUpgrades<=0)return;
 paused=true;
 $("upgradePanel").style.display="flex";
 $("upgradeChoices").innerHTML="";
 let choices=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);
 choices.forEach(up=>{
  let b=document.createElement("button");
  b.className="upgradeChoice";
  b.textContent=up.name+" – "+up.desc;
  b.onclick=()=>{
   up.apply();
   pendingUpgrades--;
   $("upgradePanel").style.display="none";
   paused=false;
   if(pendingUpgrades>0)showUpgrade();
  };
  $("upgradeChoices").appendChild(b);
 });
}

function openCodePanel(){
 paused=true;
 $("codePanel").style.display="block";
 setTimeout(()=>$("codeInput").focus(),50);
}
function closeCodePanel(){
 $("codePanel").style.display="none";
 paused=false;
 if(pendingUpgrades>0)showUpgrade();
}
$("hamburger").onclick=()=>{
 if($("codePanel").style.display==="block")closeCodePanel();
 else openCodePanel();
};

function redeemCode(){
 const code=$("codeInput").value.trim().toLowerCase();
 const message=$("message");
 if(!code){message.textContent="Bitte gib einen Code ein.";return;}

 if(code==="xp"){
  addXP(20000);
  message.textContent="+20.000 XP erhalten!";
 }
 else if(code==="opxp"){
  addXP(100000000);
  message.textContent="+100.000.000 XP erhalten!";
 }
 else if(code==="speed"){
  if(usedCodes.speed){message.textContent="Speed wurde schon benutzt!";return;}
  usedCodes.speed=true;
  player.speed=230*20;
  message.textContent="20-fache Geschwindigkeit aktiviert!";
 }
 else if(code==="level"){
  if(usedCodes.level){message.textContent="Level wurde schon benutzt!";return;}
  usedCodes.level=true;
  player.level=1000;
  player.wave=1000;
  spawnTimer=0;
  message.textContent="Level 1000 und Welle 1000!";
 }
 else if(code==="op"){
  if(usedCodes.op){message.textContent="OP wurde schon benutzt!";return;}
  usedCodes.op=true;
  player.immortal=true;
  player.health=Infinity;
  player.maxHealth=Infinity;
  player.level=10000000;
  player.wave=10000000;
  player.damage=1000000;
  player.speed=Math.max(player.speed,1000);
  player.swordRange=150;
  player.swordWidth=40;
  spawnTimer=0;
  message.textContent="OP-Modus aktiviert!";
 }
 else if(code==="new"){
  player.newWeapon=true;
  message.textContent="NEUE SUPERWAFFE AKTIVIERT!";
 }
 else{
  message.textContent="Unbekannter Code!";
  return;
 }
 $("codeInput").value="";
 updateHUD();
 setTimeout(()=>{
  if($("codePanel").style.display==="block")closeCodePanel();
 },1000);
}
$("redeemButton").onclick=redeemCode;
$("codeInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")redeemCode();
});

$("playButton").onclick=()=>{
 $("menu").style.display="none";
 running=true;
 paused=false;
 lastTime=performance.now();
 requestAnimationFrame(loop);
 startMusic();
};

let audio=null;
function startMusic(){
 if(audio)return;
 try{
  audio=new(window.AudioContext||window.webkitAudioContext)();
  let osc=audio.createOscillator(),gain=audio.createGain();
  osc.type="sine";osc.frequency.value=110;gain.gain.value=.025;
  osc.connect(gain);gain.connect(audio.destination);osc.start();
 }catch(e){}
}

function distanceToSegment(px,py,x1,y1,x2,y2){
 let dx=x2-x1,dy=y2-y1;
 let t=((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1);
 t=Math.max(0,Math.min(1,t));
 return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}

function hitMonster(m,damage){
 m.hp-=damage;
 if(m.hp<=0){
  orbs.push({x:m.x,y:m.y,r:7,xp:m.xp});
  m.dead=true;
 }
}

function update(dt){
 elapsed+=dt;
 if(paused)return;

 let mx=0,my=0;
 if(keys.ArrowLeft||keys.a)mx--;
 if(keys.ArrowRight||keys.d)mx++;
 if(keys.ArrowUp||keys.w)my--;
 if(keys.ArrowDown||keys.s)my++;
 mx+=joystick.dx;my+=joystick.dy;
 let length=Math.hypot(mx,my);
 if(length>1){mx/=length;my/=length;}
 player.x+=mx*player.speed*dt;
 player.y+=my*player.speed*dt;

 player.swordAngle+=dt*3.3;
 if(player.newWeapon)player.newWeaponAngle+=dt*30;

 spawnTimer-=dt;
 if(spawnTimer<=0){
  spawnMonster();
  spawnTimer=Math.max(.35,1.5-player.wave*.055);
 }

 for(let m of monsters){
  let dx=player.x-m.x,dy=player.y-m.y;
  let d=Math.hypot(dx,dy)||1;
  m.x+=dx/d*m.speed*dt;
  m.y+=dy/d*m.speed*dt;

  m.hitCooldown-=dt;
  m.swordCooldown-=dt;
  m.bodyCooldown-=dt;

  // Gegner berührt den Spieler: beide verursachen Schaden.
  if(d<player.r+m.r+3){
   if(m.bodyCooldown<=0){
    if(!player.immortal)player.health-=m.damage;
    hitMonster(m,player.damage);
    m.bodyCooldown=.65;
    if(player.health<=0)gameOver();
   }
  }

  // Normales Schwert: Schaden nur bei tatsächlichem Kontakt.
  const sx=player.x+Math.cos(player.swordAngle)*player.swordRange;
  const sy=player.y+Math.sin(player.swordAngle)*player.swordRange;
  const ex=player.x+Math.cos(player.swordAngle)*12;
  const ey=player.y+Math.sin(player.swordAngle)*12;
  if(m.swordCooldown<=0&&distanceToSegment(m.x,m.y,ex,ey,sx,sy)<m.r+player.swordWidth*.5){
   hitMonster(m,player.damage);
   m.swordCooldown=.22;
  }

  // Neue dicke, ultraschnelle Laserwaffe.
  if(player.newWeapon){
   const range=player.swordRange+25;
   const halfWidth=17;
   const ax=player.x+Math.cos(player.newWeaponAngle)*12;
   const ay=player.y+Math.sin(player.newWeaponAngle)*12;
   const bx=player.x+Math.cos(player.newWeaponAngle)*range;
   const by=player.y+Math.sin(player.newWeaponAngle)*range;
   if(!m.newWeaponCooldown)m.newWeaponCooldown=0;
   m.newWeaponCooldown-=dt;
   if(m.newWeaponCooldown<=0&&distanceToSegment(m.x,m.y,ax,ay,bx,by)<m.r+halfWidth){
    hitMonster(m,player.damage*4);
    m.newWeaponCooldown=.08;
   }
  }
 }
 monsters=monsters.filter(m=>!m.dead);

 for(let o of orbs){
  if(Math.hypot(player.x-o.x,player.y-o.y)<player.r+o.r+5){
   addXP(o.xp);o.dead=true;
  }
 }
 orbs=orbs.filter(o=>!o.dead);
}

function drawWorld(){
 ctx.fillStyle="#18252b";ctx.fillRect(0,0,W,H);
 const ox=W/2-player.x,oy=H/2-player.y;
 ctx.strokeStyle="#ffffff0b";ctx.lineWidth=1;
 for(let x=-((player.x%100)+100)%100;x<W;x+=100){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=-((player.y%100)+100)%100;y<H;y+=100){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 for(let t of trees){
  let x=t.x+ox,y=t.y+oy;
  if(x<-60||x>W+60||y<-60||y>H+60)continue;
  ctx.fillStyle="#533b2b";ctx.fillRect(x-4,y,8,20);
  ctx.fillStyle="#236443";ctx.beginPath();ctx.arc(x,y-5,t.r,0,Math.PI*2);ctx.fill();
 }
 for(let o of orbs){
  let x=o.x+ox,y=o.y+oy;
  ctx.fillStyle="#65eaff";ctx.shadowBlur=14;ctx.shadowColor="#65eaff";
  ctx.beginPath();ctx.arc(x,y,o.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 }

 for(let m of monsters){
  let x=m.x+ox,y=m.y+oy;
  ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(x,y,m.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#172027";
  ctx.beginPath();ctx.arc(x-m.r*.3,y-3,2.5,0,Math.PI*2);ctx.arc(x+m.r*.3,y-3,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#501e24";ctx.fillRect(x-m.r,y-m.r-10,m.r*2,4);
  ctx.fillStyle="#75f08c";ctx.fillRect(x-m.r,y-m.r-10,m.r*2*Math.max(0,m.hp/m.maxHp),4);
 }

 const px=W/2,py=H/2;
 ctx.fillStyle="#f2c28d";ctx.beginPath();ctx.arc(px,py,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#17232b";
 ctx.beginPath();ctx.arc(px-5,py-4,2.5,0,Math.PI*2);ctx.arc(px+5,py-4,2.5,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#6b3428";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(px,py+2,6,.15,Math.PI-.15);ctx.stroke();

 // Normales Schwert.
 const angle=player.swordAngle;
 const sx=px+Math.cos(angle)*player.swordRange;
 const sy=py+Math.sin(angle)*player.swordRange;
 const ex=px+Math.cos(angle)*12,ey=py+Math.sin(angle)*12;
 ctx.lineCap="round";ctx.strokeStyle="#9cf8ff";
 ctx.lineWidth=player.swordWidth*.65;ctx.shadowBlur=15;ctx.shadowColor="#42dfff";
 ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(sx,sy);ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle="#f4ffff";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(sx,sy);ctx.stroke();

 // Zusätzliche NEW-Laserwaffe.
 if(player.newWeapon){
  const a=player.newWeaponAngle,range=player.swordRange+25;
  const x2=px+Math.cos(a)*range,y2=py+Math.sin(a)*range;
  ctx.lineCap="round";
  ctx.shadowBlur=30;ctx.shadowColor="#ff39f5";
  ctx.strokeStyle="#ed3cff";ctx.lineWidth=34;
  ctx.beginPath();ctx.moveTo(px+Math.cos(a)*10,py+Math.sin(a)*10);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.shadowBlur=18;ctx.strokeStyle="#fff4ff";ctx.lineWidth=11;
  ctx.beginPath();ctx.moveTo(px+Math.cos(a)*10,py+Math.sin(a)*10);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.shadowBlur=0;
 }
}

function updateHUD(){
 $("health").textContent=player.immortal?"∞":Math.max(0,Math.floor(player.health));
 $("level").textContent=player.level.toLocaleString("de-DE");
 $("xp").textContent=Math.floor(player.xp).toLocaleString("de-DE");
 $("xpNeeded").textContent=player.xpNeeded.toLocaleString("de-DE");
 $("wave").textContent=player.wave.toLocaleString("de-DE");
 $("damage").textContent=player.damage.toLocaleString("de-DE");
 $("speed").textContent=Math.floor(player.speed).toLocaleString("de-DE");
 $("weaponStatus").textContent=player.newWeapon?"Aktiv":"Aus";
}

function loop(now){
 if(!running)return;
 let dt=Math.min((now-lastTime)/1000,.04);
 lastTime=now;
 update(dt);drawWorld();updateHUD();
 requestAnimationFrame(loop);
}

function gameOver(){
 if(player.immortal)return;
 running=false;paused=true;
 setTimeout(()=>{
  alert("Game Over! Du hast Level "+player.level+" erreicht.");
  location.reload();
 },100);
}

addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key]=false);

const joy=$("joystick"),stick=$("stick");
function joyStart(e){
 if(e.target.closest("#codePanel")||e.target.closest("button")||!running)return;
 if(joystick.active)return;
 joystick.active=true;joystick.id=e.pointerId;
 joystick.x=e.clientX;joystick.y=e.clientY;
 joy.style.display="block";
 joy.style.left=e.clientX+"px";joy.style.top=e.clientY+"px";
 joyMove(e);
}
function joyMove(e){
 if(!joystick.active||e.pointerId!==joystick.id)return;
 let dx=e.clientX-joystick.x,dy=e.clientY-joystick.y;
 let d=Math.hypot(dx,dy),max=38;
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 joystick.dx=dx/max;joystick.dy=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}
function joyEnd(e){
 if(e.pointerId!==joystick.id)return;
 joystick.active=false;joystick.id=null;
 joystick.dx=0;joystick.dy=0;
 joy.style.display="none";stick.style.transform="translate(0,0)";
}
addEventListener("pointerdown",joyStart);
addEventListener("pointermove",joyMove);
addEventListener("pointerup",joyEnd);
addEventListener("pointercancel",joyEnd);
</script>
</body>
</html>
